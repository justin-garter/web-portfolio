<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="hl-title hl-desc" class="hl-net">
<title id="hl-title">Home lab network</title>
<desc id="hl-desc">Only two ports reach the lab from the internet. The website arrives over HTTPS through Cloudflare on port 443. Minecraft arrives directly on port 25565. Devices on the house network reach only Jellyfin on port 8096. OPNsense, a virtual machine on Proxmox, is the gateway for four lab segments: DMZ, SERVERS, MAIN and MGMT. Proxmox keeps a separate out-of-band path over the house guest Wi-Fi with Tailscale.</desc>
<style>
.hl-net{--bg:#F5F6F7;--panel:#FFFFFF;--ink:#111315;--ink2:#3B4045;--ink3:#61676D;--line:#C9CED3;--tint:#ECEEF0;--focus:#111315;
 --sky:#269DD9;--vio:#A44CF0;--mag:#D9269D;
 font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}
@media (prefers-color-scheme:dark){.hl-net{--bg:#17191B;--panel:#212427;--ink:#ECEEF0;--ink2:#C3C8CD;--ink3:#A8AEB4;--line:#3A4045;--tint:#1C1F22;--focus:#ECEEF0}}
:root[data-theme="light"] .hl-net{--bg:#F5F6F7;--panel:#FFFFFF;--ink:#111315;--ink2:#3B4045;--ink3:#61676D;--line:#C9CED3;--tint:#ECEEF0;--focus:#111315}
:root[data-theme="dark"] .hl-net{--bg:#17191B;--panel:#212427;--ink:#ECEEF0;--ink2:#C3C8CD;--ink3:#A8AEB4;--line:#3A4045;--tint:#1C1F22;--focus:#ECEEF0}
.hl-net .bg{fill:var(--bg)}
.hl-net .box{fill:var(--panel);stroke:var(--line);stroke-width:1.25}
.hl-net .zone{fill:var(--tint);stroke:var(--line);stroke-width:1}
.hl-net .h{font-family:'Space Grotesk','Inter',Arial,sans-serif;font-weight:600;fill:var(--ink)}
.hl-net .t{fill:var(--ink2)}
.hl-net .q{fill:var(--ink3)}
.hl-net .m{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace;fill:var(--ink2)}
.hl-net .ic{fill:none;stroke:var(--ink3);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.hl-net .p{fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.hl-net .web{stroke:var(--sky)} .hl-net .mc{stroke:var(--vio)} .hl-net .jf{stroke:var(--mag)}
.hl-net .adm{fill:none;stroke:var(--ink3);stroke-width:1.5}
.hl-net .oob{fill:none;stroke:var(--ink3);stroke-width:1.5;stroke-dasharray:6 5}
.hl-net .node{cursor:default;outline:none}
.hl-net .node:hover .box,.hl-net .node:focus .box{stroke:var(--focus);stroke-width:2}
.hl-net .tip{opacity:0;pointer-events:none;transition:opacity .15s}
.hl-net .node:hover .tip,.hl-net .node:focus .tip{opacity:1}
.hl-net .hint{transition:opacity .15s}
.hl-net:has(.node:hover) .hint,.hl-net:has(.node:focus) .hint{opacity:0}
@media (prefers-reduced-motion:reduce){.hl-net .tip,.hl-net .hint{transition:none}}
</style>
<defs>
<marker id="hl-a-web" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--sky)"/></marker>
<marker id="hl-a-mc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--vio)"/></marker>
<marker id="hl-a-jf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--mag)"/></marker>
<marker id="hl-a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--ink3)"/></marker>
</defs>
<rect class="bg" width="100%" height="100%" rx="12"/>
<text class="h" x="40" y="48" font-size="24">Home lab network</text>
<text class="q" x="40" y="74" font-size="14">Only two ports reach the lab from the internet</text>
<line class="p web" x1="520" y1="44" x2="546" y2="44"/><text class="t" x="554" y="49" font-size="13">Website · 443 via Cloudflare</text>
<line class="p mc" x1="770" y1="44" x2="796" y2="44"/><text class="t" x="804" y="49" font-size="13">Minecraft · 25565 direct</text>
<line class="p jf" x1="975" y1="44" x2="1001" y2="44"/><text class="t" x="1009" y="49" font-size="13">Jellyfin · 8096 house only</text>
<line class="oob" x1="520" y1="68" x2="546" y2="68"/><text class="t" x="554" y="73" font-size="13">Out-of-band · Wi-Fi + Tailscale</text>
<line class="adm" x1="770" y1="68" x2="796" y2="68"/><text class="t" x="804" y="73" font-size="13">Admin routing</text>
<g><rect class="box" x="40" y="650" width="760" height="120" rx="10"/>
<text class="q hint" x="64" y="716" font-size="14">Hover over or tap any box for addresses and firewall rules.</text></g>
<rect class="zone" x="40" y="250" width="480" height="320" rx="12"/>
<text class="h" x="60" y="278" font-size="15">House network</text><text class="q" x="60" y="298" font-size="12.5">roommate-owned, untrusted</text>
<g><path class="p web" d="M230 155H296" marker-end="url(#hl-a-web)"/><path class="p web" d="M410 200V286" marker-end="url(#hl-a-web)"/><path class="p web" d="M500 315H576" marker-end="url(#hl-a-web)"/><path class="p web" d="M770 160H836" marker-end="url(#hl-a-web)"/><path class="p mc" d="M200 200L317 317" marker-end="url(#hl-a-mc)"/><path class="p mc" d="M500 345H576" marker-end="url(#hl-a-mc)"/><path class="p mc" d="M770 210H836" marker-end="url(#hl-a-mc)"/><path class="p jf" d="M240 420H576" marker-end="url(#hl-a-jf)"/><path class="p jf" d="M770 335H836" marker-end="url(#hl-a-jf)"/><path class="adm" d="M770 455H836" marker-end="url(#hl-a-ink)"/><path class="adm" d="M770 560H836" marker-end="url(#hl-a-ink)"/><path class="oob" d="M500 510H545V625H836" marker-end="url(#hl-a-ink)"/></g>
<text class="m" x="418" y="232" font-size="12.5">443 only</text>
<text class="m" x="222" y="236" font-size="12.5" text-anchor="end">25565</text>
<text class="m" x="268" y="412" font-size="12.5">8096</text>
<text class="m" x="600" y="618" font-size="12.5">out-of-band</text>
<g class="node" tabindex="0" aria-label="Internet"><rect class="box" x="40" y="110" width="190" height="90" rx="10"/><g class="ic"><circle cx="72" cy="155" r="14"/><path d="M58 155H86M72 141c-6 8-6 20 0 28M72 141c6 8 6 20 0 28"/></g><text class="h" x="98" y="150" font-size="18">Internet</text><text class="t" x="98" y="172" font-size="13">visitors, players</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">Internet</text><text class="t" x="64" y="708" font-size="13.5">Website visitors reach only Cloudflare, never the house IP directly.</text><text class="t" x="64" y="728" font-size="13.5">Minecraft players resolve justingarter.com through an SRV record to a DNS-only</text><text class="t" x="64" y="748" font-size="13.5">origin record kept current by DDNS on the web Pi.</text></g></g>
<g class="node" tabindex="0" aria-label="Cloudflare"><rect class="box" x="300" y="110" width="200" height="90" rx="10"/><path class="ic" d="M322 166h34a10 10 0 0 0 0-20 14 14 0 0 0-27-3 9 9 0 0 0-7 23z"/><text class="h" x="372" y="150" font-size="18">Cloudflare</text><text class="t" x="372" y="172" font-size="13">proxy + WAF</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">Cloudflare · proxy, TLS and WAF</text><text class="t" x="64" y="708" font-size="13.5">Full (Strict) TLS to a Cloudflare Origin CA certificate on the web Pi.</text><text class="t" x="64" y="728" font-size="13.5">WAF custom rule drops scanner paths at the edge: ~1,250 origin 404s in 37 h, then 0.</text><text class="t" x="64" y="748" font-size="13.5">OPNsense admits 443 only from Cloudflare's published ranges.</text></g></g>
<g class="node" tabindex="0" aria-label="House router"><rect class="box" x="320" y="290" width="180" height="80" rx="10"/><text class="h" x="340" y="322" font-size="16">House router</text><text class="t" x="340" y="344" font-size="13">TP-Link Archer BE9500</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">House router · 192.168.0.1</text><text class="t" x="64" y="708" font-size="13.5">Roommate-owned, no VLAN support, so segmentation lives behind it in OPNsense.</text><text class="t" x="64" y="728" font-size="13.5">Forwards exactly two ports to OPNsense's WAN at 192.168.0.254: TCP 443 and TCP 25565.</text><text class="t" x="64" y="748" font-size="13.5">Nothing in the lab may start a connection to the house network.</text></g></g>
<g class="node" tabindex="0" aria-label="House devices"><rect class="box" x="60" y="380" width="180" height="80" rx="10"/><text class="h" x="80" y="412" font-size="16">House devices</text><text class="t" x="80" y="434" font-size="13">phone, laptop, TV</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">House devices · 192.168.0.0/24</text><text class="t" x="64" y="708" font-size="13.5">Reach Jellyfin through an OPNsense port forward on 192.168.0.254:8096.</text><text class="t" x="64" y="728" font-size="13.5">Port 8096 to one VM is the only thing the house network can open in the lab.</text><text class="t" x="64" y="748" font-size="13.5">Logins are non-admin accounts with a 5-attempt lockout.</text></g></g>
<g class="node" tabindex="0" aria-label="Guest Wi-Fi"><rect class="box" x="320" y="470" width="180" height="80" rx="10"/><text class="h" x="340" y="502" font-size="16">Guest Wi-Fi</text><text class="t" x="340" y="524" font-size="13">out-of-band link</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">Out-of-band path · guest Wi-Fi + Tailscale</text><text class="t" x="64" y="708" font-size="13.5">Proxmox has an Intel AX210 on the house guest Wi-Fi with Tailscale bound to it.</text><text class="t" x="64" y="728" font-size="13.5">Tested from a phone on cellular: shut down OPNsense, Proxmox stayed reachable.</text><text class="t" x="64" y="748" font-size="13.5">A healthchecks.io heartbeat emails if this path drops.</text></g></g>
<g class="node" tabindex="0" aria-label="OPNsense gateway"><rect class="box" x="580" y="110" width="190" height="470" rx="10"/><path class="ic" d="M675 136l-16 6v11c0 10 7 17 16 21 9-4 16-11 16-21v-11z"/><text class="h" x="675" y="204" font-size="20" text-anchor="middle">OPNsense</text><text class="t" x="675" y="228" font-size="13" text-anchor="middle">VM on Proxmox</text><text class="q" x="675" y="270" font-size="12.5" text-anchor="middle">gateway for</text><text class="q" x="675" y="288" font-size="12.5" text-anchor="middle">every segment</text><text class="q" x="675" y="318" font-size="12.5" text-anchor="middle">default deny</text><text class="q" x="675" y="336" font-size="12.5" text-anchor="middle">between them</text><line x1="604" y1="500" x2="746" y2="500" style="stroke:var(--line)"/><text class="q" x="675" y="528" font-size="12.5" text-anchor="middle">5-port 802.1Q trunk</text><text class="q" x="675" y="546" font-size="12.5" text-anchor="middle">switch mgmt on VLAN 1</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">OPNsense 26.7 · VM 100 on Proxmox VE 9</text><text class="t" x="64" y="708" font-size="13.5">Router on a stick over one NIC, trunked through a TL-SG105E switch. WAN 192.168.0.254.</text><text class="t" x="64" y="728" font-size="13.5">Gateways: MGMT 10.10.10.1 · MAIN 10.10.20.1 · SERVERS 10.10.30.1 · DMZ 10.10.40.1.</text><text class="t" x="64" y="748" font-size="13.5">Switch management sits alone on VLAN 1 (172.31.0.0/24). Every host adds its own nftables.</text></g></g>
<g class="node" tabindex="0" aria-label="DMZ, VLAN 40"><rect class="box" x="840" y="110" width="320" height="150" rx="10"/><text class="h" x="864" y="142" font-size="17">DMZ · VLAN 40</text><text class="t" x="864" y="170" font-size="14">Web Pi · Caddy</text><text class="m" x="1136" y="170" font-size="12.5" text-anchor="end">443</text><text class="t" x="864" y="196" font-size="14">vm-minecraft · 2 modpacks</text><text class="m" x="1136" y="196" font-size="12.5" text-anchor="end">25565</text><text class="q" x="864" y="236" font-size="12.5">internet only · never on Tailscale</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">DMZ · VLAN 40 · 10.10.40.0/24 · static addressing only</text><text class="t" x="64" y="708" font-size="13.5">Web Pi 10.10.40.10: Raspberry Pi 5, Caddy, 443 only, Cloudflare Origin CA certificate.</text><text class="t" x="64" y="728" font-size="13.5">vm-minecraft 10.10.40.20: Debian 13, 10 GB, worlds backed up at 02:15 before the 03:00 VM backup.</text><text class="t" x="64" y="748" font-size="13.5">Reaches the internet and its own DNS only. Kept off Tailscale so a compromise can't pivot.</text></g></g>
<g class="node" tabindex="0" aria-label="SERVERS, VLAN 30"><rect class="box" x="840" y="280" width="320" height="110" rx="10"/><text class="h" x="864" y="312" font-size="17">SERVERS · VLAN 30</text><text class="t" x="864" y="340" font-size="14">vm-services · Jellyfin</text><text class="m" x="1136" y="340" font-size="12.5" text-anchor="end">8096</text><text class="q" x="864" y="370" font-size="12.5">internet only</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">SERVERS · VLAN 30 · 10.10.30.0/24</text><text class="t" x="64" y="708" font-size="13.5">vm-services 10.10.30.10: Debian 13, Docker, Jellyfin 12, CPU transcoding.</text><text class="t" x="64" y="728" font-size="13.5">8096 admitted from the admin desktop, the house network and the monitoring Pi only.</text><text class="t" x="64" y="748" font-size="13.5">Reaches the internet and its own DNS only.</text></g></g>
<g class="node" tabindex="0" aria-label="MAIN, VLAN 20"><rect class="box" x="840" y="410" width="320" height="90" rx="10"/><text class="h" x="864" y="442" font-size="17">MAIN · VLAN 20</text><text class="t" x="864" y="470" font-size="14">Admin desktop · Ansible</text><text class="q" x="1136" y="470" font-size="12.5" text-anchor="end">reaches all</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">MAIN · VLAN 20 · 10.10.20.0/24</text><text class="t" x="64" y="708" font-size="13.5">Admin desktop 10.10.20.10, pinned by a static mapping.</text><text class="t" x="64" y="728" font-size="13.5">The only segment that reaches every other segment. Runs Ansible from WSL.</text><text class="t" x="64" y="748" font-size="13.5">20 roles across two repos, secrets in an encrypted vault.</text></g></g>
<g class="node" tabindex="0" aria-label="MGMT, VLAN 10"><rect class="box" x="840" y="520" width="320" height="140" rx="10"/><text class="h" x="864" y="552" font-size="17">MGMT · VLAN 10</text><text class="t" x="864" y="580" font-size="14">Proxmox host</text><text class="t" x="864" y="606" font-size="14">Backup Pi · restic, Uptime Kuma</text><text class="q" x="864" y="640" font-size="12.5">SSH and monitoring to servers</text><g class="tip" aria-hidden="true"><text class="h" x="64" y="682" font-size="16">MGMT · VLAN 10 · 10.10.10.0/24</text><text class="t" x="64" y="708" font-size="13.5">Proxmox 10.10.10.5: Ryzen 7 2700X, 32 GB, ZFS. Runs OPNsense and both VMs.</text><text class="t" x="64" y="728" font-size="13.5">Backup Pi 10.10.10.20: nightly VM backups into append-only restic, restore tested.</text><text class="t" x="64" y="748" font-size="13.5">Reaches SERVERS and DMZ on SSH plus specific monitoring ports.</text></g></g>
</svg>
